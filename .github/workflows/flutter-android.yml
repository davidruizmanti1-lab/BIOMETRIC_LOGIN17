name: Flutter Android
on:
  push:
    branches: [velero2h-mobile-aqua]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter SDK
        run: |
          git clone --depth 1 --branch 3.38.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Compile debug APK without credentials
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: velero2h-debug-no-config
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
